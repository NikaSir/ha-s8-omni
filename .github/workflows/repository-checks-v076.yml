name: Overview v0.7.6 staging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-v076:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply v0.7.6 patch once
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          if grep -q 'const UI_VERSION = "v0.7.5"' custom_components/s8_omni/frontend/s8-omni-panel.js; then
            python .github/patch_v076.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ui: implement approved Overview composition in v0.7.6"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Validate JSON and Python
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text(encoding='utf-8'))
          PY
          python -m compileall -q custom_components

      - name: Validate frontend JavaScript
        run: node --check custom_components/s8_omni/frontend/s8-omni-panel.js

      - name: Validate approved Overview contract
        shell: bash
        run: |
          js=custom_components/s8_omni/frontend/s8-omni-panel.js
          init=custom_components/s8_omni/__init__.py
          grep -q 'const UI_VERSION = "v0.7.6"' "$js"
          grep -q 'productArtUrl(artMode)' "$js"
          grep -q '/s8_omni/product-art/' "$js"
          grep -q 'class S8ProductArtView' "$init"
          grep -q 'requires_auth = False' "$init"
          grep -q 'Чистая вода' "$js"
          grep -q 'Грязная вода' "$js"
          grep -q 'Пыль/мешок' "$js"
          grep -q 'Тёплый воздух' "$js"
          grep -q 'Зарядка' "$js"
          grep -q '<strong>Робот</strong>' "$js"
          grep -q '<strong>Станция</strong>' "$js"
          grep -q '<strong>Пылесборник</strong>' "$js"
          if grep -q 'src="${productArtData' "$js"; then echo 'Legacy data-URI image path remains'; exit 1; fi

      - name: Validate embedded JPEG sources
        run: |
          python - <<'PY'
          import base64, re
          from pathlib import Path
          text = Path('custom_components/s8_omni/frontend/s8-omni-panel.js').read_text(encoding='utf-8')
          for name in ('PRODUCT_ART_CLEAN_BASE64', 'PRODUCT_ART_DOCK_BASE64'):
              m = re.search(rf'const {name} = "([^"]+)";', text)
              if not m:
                  raise SystemExit(f'Missing {name}')
              data = base64.b64decode(m.group(1), validate=True)
              if not data.startswith(b'\xff\xd8') or not data.endswith(b'\xff\xd9') or len(data) < 10000:
                  raise SystemExit(f'Invalid JPEG source: {name}')
              print(name, len(data))
          PY
