name: Apply resource strip typography b051

on:
  push:
    branches:
      - fix/resource-strip-typography-b051
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resource-strip-typography-b051
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Polish Overview resource strip
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          js = Path('custom_components/s8_omni/frontend/s8-omni-panel.js')
          text = js.read_text(encoding='utf-8')
          old = '.resource-chip strong,.resource-chip small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resource-chip strong{font-size:10px}.resource-chip small{font-size:9px;color:var(--secondary-text-color);margin-top:2px}'
          new = '.resource-chip strong,.resource-chip small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resource-chip strong{font-size:11px;line-height:1.08;font-weight:760;letter-spacing:-.01em}.resource-chip small{font-size:10px;line-height:1.08;color:var(--secondary-text-color);margin-top:2px}'
          if old not in text:
              raise SystemExit('desktop resource typography block not found')
          text = text.replace(old, new, 1)

          old_mobile = '@media(max-width:430px){.state-scene{height:376px}.resource-strip{left:7px;right:7px;bottom:7px}.resource-chip{grid-template-columns:29px minmax(0,1fr);gap:4px;padding:7px 5px}.resource-chip ha-icon{--mdc-icon-size:22px}.resource-chip strong{font-size:8.8px}.resource-chip small{font-size:8.2px}.state-hero h1{font-size:30px}}'
          new_mobile = '@media(max-width:430px){.state-scene{height:376px}.resource-strip{left:7px;right:7px;bottom:7px}.resource-chip{grid-template-columns:30px minmax(0,1fr);gap:4px;padding:7px 4px}.resource-chip ha-icon{--mdc-icon-size:23px}.resource-chip strong{font-size:10.2px;line-height:1.06}.resource-chip small{font-size:9.3px;line-height:1.06}.state-hero h1{font-size:30px}}'
          if old_mobile not in text:
              raise SystemExit('mobile resource typography block not found')
          text = text.replace(old_mobile, new_mobile, 1)
          js.write_text(text, encoding='utf-8')

          const = Path('custom_components/s8_omni/const.py')
          c = const.read_text(encoding='utf-8').replace('VERSION = "v1.00_b050"', 'VERSION = "v1.00_b051"', 1)
          const.write_text(c, encoding='utf-8')

          manifest = Path('custom_components/s8_omni/manifest.json')
          m = json.loads(manifest.read_text(encoding='utf-8'))
          m['version'] = '1.0.0b51'
          manifest.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          node --check custom_components/s8_omni/frontend/s8-omni-panel.js
          python -m compileall -q custom_components
          grep -q 'font-size:10.2px' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'font-size:9.3px' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'VERSION = "v1.00_b051"' custom_components/s8_omni/const.py
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/s8_omni/frontend/s8-omni-panel.js custom_components/s8_omni/const.py custom_components/s8_omni/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "ui: polish Overview resource strip typography"
            git push origin HEAD:fix/resource-strip-typography-b051
          fi
