name: Apply resource strip typography b053

on:
  push:
    branches:
      - fix/resource-strip-font-b053
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resource-strip-font-b053
          fetch-depth: 0
      - name: Apply typography patch
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('custom_components/s8_omni/frontend/s8-omni-panel.js')
          text = js.read_text(encoding='utf-8')
          replacements = {
              '.resource-chip strong{font-size:11px;line-height:1.08;font-weight:760;letter-spacing:-.01em}.resource-chip small{font-size:10px;line-height:1.08;color:var(--secondary-text-color);margin-top:2px}':
              '.resource-chip strong{font-size:12.4px;line-height:1.06;font-weight:780;letter-spacing:-.012em}.resource-chip small{font-size:11.2px;line-height:1.06;color:var(--secondary-text-color);margin-top:2px}',
              '.resource-chip strong{font-size:10.2px;line-height:1.06}.resource-chip small{font-size:9.3px;line-height:1.06}':
              '.resource-chip strong{font-size:11.7px;line-height:1.04}.resource-chip small{font-size:10.6px;line-height:1.04}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected CSS fragment not found: {old}')
              text = text.replace(old, new, 1)
          js.write_text(text, encoding='utf-8')

          const = Path('custom_components/s8_omni/const.py')
          text = const.read_text(encoding='utf-8')
          if 'VERSION = "v1.00_b052"' not in text:
              raise SystemExit('Unexpected integration version')
          text = text.replace('VERSION = "v1.00_b052"', 'VERSION = "v1.00_b053"', 1)
          const.write_text(text, encoding='utf-8')

          manifest = Path('custom_components/s8_omni/manifest.json')
          text = manifest.read_text(encoding='utf-8')
          if '"version": "1.0.0b52"' not in text:
              raise SystemExit('Unexpected manifest version')
          text = text.replace('"version": "1.0.0b52"', '"version": "1.0.0b53"', 1)
          manifest.write_text(text, encoding='utf-8')

          init = Path('custom_components/s8_omni/__init__.py')
          text = init.read_text(encoding='utf-8')
          old = 'PANEL_MODULE = f"{PANEL_STATIC_URL}/s8-omni-panel.js?v={DASHBOARD_VERSION}"'
          new = 'PANEL_MODULE = f"{PANEL_STATIC_URL}/s8-omni-panel.js?v={DASHBOARD_VERSION}-{VERSION}"'
          if old not in text:
              raise SystemExit('Expected PANEL_MODULE cache-busting expression not found')
          text = text.replace(old, new, 1)
          init.write_text(text, encoding='utf-8')
          PY
      - name: Validate syntax
        run: |
          node --check custom_components/s8_omni/frontend/s8-omni-panel.js
          python -m compileall -q custom_components
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/s8_omni/frontend/s8-omni-panel.js custom_components/s8_omni/const.py custom_components/s8_omni/manifest.json custom_components/s8_omni/__init__.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "ui: enlarge resource strip typography"
            git push origin HEAD:fix/resource-strip-font-b053
          fi
