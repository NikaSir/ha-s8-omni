name: S8 APK command analysis

on:
  push:
    branches:
      - research/s8-apk-command-analysis-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire original public APK
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/apks report/acquisition
          python -m pip install --disable-pip-version-check requests beautifulsoup4

          python <<'PY'
          from __future__ import annotations

          import hashlib
          import pathlib
          import re
          import sys
          import urllib.parse
          import zipfile

          import requests
          from bs4 import BeautifulSoup

          OUT = pathlib.Path("work/apks")
          LOG = pathlib.Path("report/acquisition/apkcombo.log")
          OUT.mkdir(parents=True, exist_ok=True)
          LOG.parent.mkdir(parents=True, exist_ok=True)

          PACKAGE = "com.lynkbey.app"
          VERSION = "1.2.7"
          SLUG = urllib.parse.quote("领贝机器人", safe="")
          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/126.0.0.0 Safari/537.36"
              ),
              "Accept-Language": "en-US,en;q=0.9,zh-CN;q=0.8",
          }
          session = requests.Session()
          session.headers.update(HEADERS)
          logs: list[str] = []

          def log(message: str) -> None:
              print(message, flush=True)
              logs.append(message)

          def valid_apk(path: pathlib.Path) -> bool:
              if not path.is_file() or path.stat().st_size < 1_000_000:
                  return False
              try:
                  with zipfile.ZipFile(path) as archive:
                      names = set(archive.namelist())
                      return "AndroidManifest.xml" in names and any(
                          name.endswith(".dex") for name in names
                      )
              except zipfile.BadZipFile:
                  return False

          def save_response(response: requests.Response, label: str) -> pathlib.Path | None:
              content_type = response.headers.get("content-type", "")
              disposition = response.headers.get("content-disposition", "")
              log(
                  f"{label}: status={response.status_code} final={response.url} "
                  f"type={content_type!r} disposition={disposition!r}"
              )
              response.raise_for_status()
              prefix = response.content[:4]
              if prefix != b"PK\x03\x04":
                  return None
              filename = f"{PACKAGE}-{VERSION}.apk"
              match = re.search(r"filename\*?=(?:UTF-8''|\")?([^\";]+)", disposition)
              if match:
                  candidate = urllib.parse.unquote(match.group(1)).strip()
                  if candidate.lower().endswith((".apk", ".xapk", ".apks", ".zip")):
                      filename = candidate
              target = OUT / filename
              target.write_bytes(response.content)
              if valid_apk(target):
                  digest = hashlib.sha256(target.read_bytes()).hexdigest()
                  log(f"saved valid APK: {target} size={target.stat().st_size} sha256={digest}")
                  return target
              log(f"downloaded ZIP is not a standalone APK: {target}")
              return None

          checkin = ""
          try:
              result = session.get("https://apkcombo.app/checkin", timeout=30)
              log(f"checkin: status={result.status_code} body={result.text[:200]!r}")
              if result.ok and "=" in result.text:
                  checkin = result.text.strip()
          except Exception as exc:  # noqa: BLE001
              log(f"checkin failed: {exc!r}")

          page_urls = [
              f"https://apkcombo.app/{SLUG}/{PACKAGE}/download/phone-{VERSION}-apk",
              f"https://apkcombo.com/{SLUG}/{PACKAGE}/download/apk",
              f"https://apkcombo.app/{SLUG}/{PACKAGE}/download/apk",
          ]
          direct_candidates: list[str] = []

          for page_url in page_urls:
              try:
                  response = session.get(page_url, timeout=45, allow_redirects=True)
                  if save_response(response, f"page/direct {page_url}"):
                      LOG.write_text("\n".join(logs), encoding="utf-8")
                      sys.exit(0)
                  html = response.text
                  (LOG.parent / f"page-{len(direct_candidates)}.html").write_text(
                      html[:2_000_000], encoding="utf-8", errors="replace"
                  )
                  soup = BeautifulSoup(html, "html.parser")
                  table = soup.select_one("#best-variant-tab")
                  anchors = table.select("a[href]") if table else soup.select("a[href]")
                  for anchor in anchors:
                      href = urllib.parse.urljoin(response.url, anchor.get("href", ""))
                      text = anchor.get_text(" ", strip=True).lower()
                      if not href:
                          continue
                      if any(
                          token in href.lower()
                          for token in ("download", "apkcombo", ".apk", ".xapk")
                      ) and ("apk" in text or "download" in text or table is not None):
                          direct_candidates.append(href)
                  if response.url != page_url:
                      direct_candidates.append(response.url)
              except Exception as exc:  # noqa: BLE001
                  log(f"page failed {page_url}: {exc!r}")

          seen: set[str] = set()
          for candidate in direct_candidates:
              if candidate in seen:
                  continue
              seen.add(candidate)
              urls = [candidate]
              if checkin:
                  urls.insert(0, candidate + ("&" if "?" in candidate else "?") + checkin)
              for url in urls:
                  try:
                      response = session.get(url, timeout=120, allow_redirects=True)
                      if save_response(response, f"variant {url}"):
                          LOG.write_text("\n".join(logs), encoding="utf-8")
                          sys.exit(0)
                  except Exception as exc:  # noqa: BLE001
                      log(f"variant failed {url}: {exc!r}")

          LOG.write_text("\n".join(logs), encoding="utf-8")
          raise SystemExit("APKCombo acquisition did not yield a valid APK")
          PY

      - name: Fallback to anonymous Google Play downloader
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/apks report/acquisition
          python -m pip install --disable-pip-version-check "goopdl==1.0.0" \
            || python -m pip install --disable-pip-version-check git+https://github.com/Villoh/goopdl.git
          set +e
          goopdl auth 2>&1 | tee report/acquisition/goopdl-auth.log
          auth_status=${PIPESTATUS[0]}
          goopdl download com.lynkbey.app -o work/apks --no-extras 2>&1 \
            | tee report/acquisition/goopdl-download.log
          download_status=${PIPESTATUS[0]}
          set -e
          echo "auth_status=${auth_status}" >> report/acquisition/goopdl-status.txt
          echo "download_status=${download_status}" >> report/acquisition/goopdl-status.txt
          python <<'PY'
          import pathlib
          import zipfile

          candidates = sorted(pathlib.Path("work/apks").glob("*.apk"))
          valid = []
          for path in candidates:
              try:
                  with zipfile.ZipFile(path) as archive:
                      names = archive.namelist()
                  if "AndroidManifest.xml" in names and any(name.endswith(".dex") for name in names):
                      valid.append(path)
              except zipfile.BadZipFile:
                  pass
          if not valid:
              raise SystemExit("No valid APK was acquired")
          print("Valid APKs:", *valid, sep="\n")
          PY

      - name: Verify APK and record metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p report work/unpacked
          APK="$(find work/apks -type f -name '*.apk' ! -name '*-config.*' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "${APK}"
          printf '%s\n' "${APK}" > report/selected_apk_path.txt
          file "${APK}" | tee report/file.txt
          stat --printf='size_bytes=%s\n' "${APK}" | tee report/size.txt
          sha256sum "${APK}" | tee report/sha256.txt
          sha1sum "${APK}" | tee report/sha1.txt
          unzip -t "${APK}" > report/zip_test.txt
          unzip -q "${APK}" -d work/unpacked
          find work/unpacked -maxdepth 3 -type f -printf '%P\t%s bytes\n' \
            | sort > report/apk_inventory.txt
          find work/unpacked -maxdepth 1 -type f -name 'classes*.dex' -printf '%f\t%s bytes\n' \
            | sort > report/dex_inventory.txt

          keytool -printcert -jarfile "${APK}" > report/signing_keytool.txt 2>&1 || true
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "${APKSIGNER}" ]; then
            "${APKSIGNER}" verify --verbose --print-certs "${APK}" \
              > report/signing_apksigner.txt 2>&1 || true
          fi

          APKANALYZER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" \
            -type f -name apkanalyzer 2>/dev/null | head -1 || true)"
          if [ -n "${APKANALYZER}" ]; then
            "${APKANALYZER}" manifest application-id "${APK}" \
              > report/application_id.txt 2>&1 || true
            "${APKANALYZER}" manifest version-name "${APK}" \
              > report/version_name.txt 2>&1 || true
            "${APKANALYZER}" manifest version-code "${APK}" \
              > report/version_code.txt 2>&1 || true
            "${APKANALYZER}" manifest print "${APK}" \
              > report/AndroidManifest.xml 2>&1 || true
          fi

      - name: Decompile and scan command paths
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$(cat report/selected_apk_path.txt)"
          mkdir -p work/jadx report/relevant_sources

          curl -fL --retry 4 --retry-delay 3 \
            https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip \
            -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --threads-count 2 --show-bad-code \
            -d work/jadx "${APK}" > report/jadx.log 2>&1 || true

          if [ -f work/jadx/resources/AndroidManifest.xml ]; then
            cp work/jadx/resources/AndroidManifest.xml report/AndroidManifest-jadx.xml
          fi

          PATTERN='publishDps|publishDpsWithQueryOption|setDps|setDp|sendDp|deviceControl|ThingHomeSdk|TuyaHomeSdk|IThingDevice|ITuyaDevice|chargego|selectroom|select_room|zone_clean|part_clean|goto_charge|repositing|power_go|switch_go|break_clean|customize_mode_switch|work_mode|dp_dust|dp_roll_clean|dp_roll_hot|edge_brush_life|roll_brush_life|filter_life|reset.*brush|reset.*filter|consumable|manual.*control|direction.*control|timer.*clean|schedule.*clean|room.*clean|where.*sweep'

          {
            echo '=== Decompiled source matches with context ==='
            grep -RInE -C 8 --binary-files=without-match "${PATTERN}" \
              work/jadx/sources work/jadx/resources 2>/dev/null || true
          } | head -n 30000 > report/command_keyword_context.txt

          grep -RIlE --binary-files=without-match "${PATTERN}" \
            work/jadx/sources 2>/dev/null | sort | head -n 500 \
            > report/matched_source_files.txt || true

          while IFS= read -r source; do
            [ -f "${source}" ] || continue
            relative="${source#work/jadx/sources/}"
            mkdir -p "report/relevant_sources/$(dirname "${relative}")"
            cp "${source}" "report/relevant_sources/${relative}"
          done < report/matched_source_files.txt

          {
            for dex in work/unpacked/classes*.dex; do
              [ -f "${dex}" ] || continue
              echo "=== ${dex} ==="
              strings -a "${dex}" | grep -iE "${PATTERN}" || true
            done
          } | sort -u | head -n 20000 > report/dex_command_strings.txt

          grep -RohE --binary-files=without-match \
            'https?://[^"'"'"' <>\\]+' work/jadx/sources work/jadx/resources 2>/dev/null \
            | sed 's/[),;]$//' | sort -u | head -n 5000 > report/endpoints.txt || true

          find work/jadx/resources/assets work/unpacked/assets \
            -type f -printf '%p\t%s bytes\n' 2>/dev/null \
            | sort > report/assets_inventory.txt || true

          find work/jadx/sources -type d 2>/dev/null \
            | grep -Ei '/(com/(lynkbey|tuya|thingclips)|cn/|io/flutter|com/facebook/react)' \
            | sort | head -n 10000 > report/architecture_packages.txt || true

          {
            echo '=== APK identity ==='
            cat report/application_id.txt 2>/dev/null || true
            cat report/version_name.txt 2>/dev/null || true
            cat report/version_code.txt 2>/dev/null || true
            echo
            echo '=== Hash ==='
            cat report/sha256.txt
            echo
            echo '=== App-owned source roots ==='
            find work/jadx/sources/com/lynkbey -maxdepth 5 -type d 2>/dev/null | sort || true
            echo
            echo '=== Tuya / Thing SDK roots ==='
            find work/jadx/sources/com -maxdepth 4 -type d 2>/dev/null \
              | grep -Ei '/(tuya|thingclips)' | sort | head -n 1000 || true
            echo
            echo '=== Matched file count ==='
            wc -l report/matched_source_files.txt
          } > report/summary.txt

      - name: Upload temporary research artifact
        uses: actions/upload-artifact@v4
        with:
          name: s8-linkbey-apk-command-analysis
          path: |
            work/apks/*.apk
            report/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
