name: S8 APK command analysis

on:
  push:
    branches:
      - research/s8-apk-command-analysis-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reproduce package-specific APKCombo request
        id: acquire
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/apks report/acquisition
          python -m pip install --disable-pip-version-check requests beautifulsoup4

          python <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import os
          import pathlib
          import re
          import shutil
          import time
          import urllib.parse
          import zipfile

          import requests
          from bs4 import BeautifulSoup

          PACKAGE = "com.lynkbey.app"
          NAME = "领贝机器人"
          OUT = pathlib.Path("work/apks")
          REPORT = pathlib.Path("report/acquisition")
          TARGET = OUT / "Packages_Linkbey_acquired.apk"
          OUT.mkdir(parents=True, exist_ok=True)
          REPORT.mkdir(parents=True, exist_ok=True)

          encoded_name = urllib.parse.quote(NAME, safe="")
          page_url = (
              f"https://apkcombo.com/{encoded_name}/{PACKAGE}/download/phone-1.0.3-apk"
          )
          origin = "https://apkcombo.com"
          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/126.0.0.0 Safari/537.36"
              ),
              "Accept-Language": "en-US,en;q=0.9,zh-CN;q=0.8",
          }
          session = requests.Session()
          session.headers.update(headers)
          log_lines: list[str] = []
          variants: list[str] = []

          def log(message: str) -> None:
              print(message, flush=True)
              log_lines.append(message)

          def valid_apk(path: pathlib.Path) -> bool:
              if not path.is_file() or path.stat().st_size < 1_000_000:
                  return False
              try:
                  with zipfile.ZipFile(path) as archive:
                      names = set(archive.namelist())
                  return "AndroidManifest.xml" in names and any(
                      name.endswith(".dex") for name in names
                  )
              except zipfile.BadZipFile:
                  return False

          def extract_apk(body: bytes, label: str) -> bool:
              if not body.startswith(b"PK\x03\x04"):
                  return False
              staging = OUT / "candidate.zip"
              staging.write_bytes(body)
              if valid_apk(staging):
                  shutil.move(staging, TARGET)
                  log(
                      f"Valid standalone APK from {label}: size={TARGET.stat().st_size} "
                      f"sha256={hashlib.sha256(TARGET.read_bytes()).hexdigest()}"
                  )
                  return True
              try:
                  with zipfile.ZipFile(staging) as archive:
                      members = sorted(
                          (item for item in archive.infolist() if item.filename.lower().endswith(".apk")),
                          key=lambda item: item.file_size,
                          reverse=True,
                      )
                      for member in members:
                          nested = OUT / pathlib.Path(member.filename).name
                          with archive.open(member) as source, nested.open("wb") as target:
                              shutil.copyfileobj(source, target)
                          if valid_apk(nested):
                              shutil.move(nested, TARGET)
                              log(
                                  f"Valid nested APK from {label}/{member.filename}: "
                                  f"size={TARGET.stat().st_size} "
                                  f"sha256={hashlib.sha256(TARGET.read_bytes()).hexdigest()}"
                              )
                              return True
                          nested.unlink(missing_ok=True)
              except zipfile.BadZipFile:
                  pass
              staging.unlink(missing_ok=True)
              return False

          def save_text(response: requests.Response, filename: str) -> None:
              (REPORT / filename).write_text(
                  response.text[:10_000_000], encoding="utf-8", errors="replace"
              )

          def collect_variants(text: str, base_url: str, source: str) -> None:
              soup = BeautifulSoup(text, "html.parser")
              clues: list[str] = []
              for tag in soup.find_all(True):
                  classes = " ".join(tag.get("class", []))
                  for key, value in tag.attrs.items():
                      values = value if isinstance(value, list) else [value]
                      for item in values:
                          if not isinstance(item, str):
                              continue
                          lowered = f"{classes} {key} {item}".lower()
                          if any(token in lowered for token in ("variant", "download", ".apk", ".xapk")):
                              clues.append(f"<{tag.name} class={classes!r}> {key}={item}")
                              if key in {"href", "src", "data-url", "data-href"}:
                                  variants.append(urllib.parse.urljoin(base_url, html.unescape(item)))
              for match in re.findall(r"https?://[^\s\"'<>\\]+", text):
                  if any(token in match.lower() for token in (".apk", ".xapk", "download.apkcombo")):
                      variants.append(html.unescape(match))
              (REPORT / f"{source}-clues.txt").write_text(
                  "\n".join(sorted(set(clues))), encoding="utf-8"
              )

          page = session.get(page_url, timeout=60, allow_redirects=True)
          log(f"GET page: {page.status_code} final={page.url} bytes={len(page.content)}")
          save_text(page, "apkcombo-page.html")
          page.raise_for_status()

          xid_match = re.search(r'var\s+xid\s*=\s*["\']([^"\']+)', page.text)
          if not xid_match:
              raise SystemExit("APKCombo xid was not found")
          xid = xid_match.group(1)
          endpoint = f"{origin}/{encoded_name}/{PACKAGE}/{xid}/dl"
          log(f"Discovered package endpoint: {endpoint}")

          ajax_headers = {
              "Origin": origin,
              "Referer": page.url,
              "X-Requested-With": "XMLHttpRequest",
              "Accept": "text/html, */*; q=0.01",
          }

          for requested_version in ("", "1.0.3", "1.2.7"):
              for attempt in range(1, 7):
                  response = session.post(
                      endpoint,
                      files={
                          "package_name": (None, PACKAGE),
                          "version": (None, requested_version),
                      },
                      headers=ajax_headers,
                      timeout=90,
                      allow_redirects=True,
                  )
                  label = f"post-v{requested_version or 'latest'}-attempt-{attempt}"
                  log(
                      f"POST {label}: status={response.status_code} final={response.url} "
                      f"type={response.headers.get('content-type')!r} bytes={len(response.content)}"
                  )
                  save_text(response, f"{label}.html")
                  if extract_apk(response.content, label):
                      break
                  collect_variants(response.text, response.url, label)
                  if response.status_code == 200:
                      break
                  if response.status_code not in {202, 429, 504}:
                      break
                  time.sleep(2)
              if TARGET.exists():
                  break

          checkin_values: list[str] = []
          for method in ("post", "get"):
              try:
                  response = getattr(session, method)(
                      f"{origin}/checkin",
                      headers={"Referer": page.url, "Origin": origin},
                      timeout=30,
                  )
                  log(
                      f"CHECKIN {method.upper()}: status={response.status_code} "
                      f"body={response.text[:300]!r}"
                  )
                  if response.ok and "=" in response.text:
                      checkin_values.append(response.text.strip())
              except Exception as exc:  # noqa: BLE001
                  log(f"CHECKIN {method.upper()} failed: {exc!r}")

          (REPORT / "variant_urls.txt").write_text(
              "\n".join(sorted(set(variants))), encoding="utf-8"
          )

          if not TARGET.exists():
              seen: set[str] = set()
              for raw_url in variants:
                  raw_url = html.unescape(raw_url).replace("\\/", "/").split("#", 1)[0]
                  if not raw_url.startswith(("http://", "https://")):
                      continue
                  urls = [raw_url]
                  for checkin in checkin_values:
                      separator = "&" if "?" in raw_url else "?"
                      urls.insert(
                          0,
                          raw_url
                          + separator
                          + checkin
                          + f"&package_name={urllib.parse.quote(PACKAGE)}&lang=en",
                      )
                  for url in urls:
                      if url in seen:
                          continue
                      seen.add(url)
                      try:
                          response = session.get(
                              url,
                              headers={"Referer": page.url},
                              timeout=240,
                              allow_redirects=True,
                          )
                          log(
                              f"GET variant: status={response.status_code} final={response.url} "
                              f"type={response.headers.get('content-type')!r} "
                              f"length={response.headers.get('content-length')!r}"
                          )
                          if extract_apk(response.content, "variant"):
                              break
                      except Exception as exc:  # noqa: BLE001
                          log(f"Variant failed {url}: {exc!r}")
                  if TARGET.exists():
                      break

          (REPORT / "acquisition.log").write_text("\n".join(log_lines), encoding="utf-8")
          found = TARGET.exists() and valid_apk(TARGET)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"found={'true' if found else 'false'}\n")
              if found:
                  output.write(f"apk_path={TARGET}\n")
          if not found:
              log("No APK was returned; preserved all package-specific responses")
          PY

      - name: Verify exact Linkbey identity
        id: verify
        if: steps.acquire.outputs.found == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="${{ steps.acquire.outputs.apk_path }}"
          mkdir -p report work/unpacked
          printf '%s\n' "${APK}" > report/selected_apk_path.txt
          file "${APK}" | tee report/file.txt
          stat --printf='size_bytes=%s\n' "${APK}" | tee report/size.txt
          sha256sum "${APK}" | tee report/sha256.txt
          sha1sum "${APK}" | tee report/sha1.txt
          unzip -t "${APK}" > report/zip_test.txt
          unzip -q "${APK}" -d work/unpacked

          APKANALYZER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" \
            -type f -name apkanalyzer 2>/dev/null | head -1)"
          APP_ID="$("${APKANALYZER}" manifest application-id "${APK}")"
          VERSION_NAME="$("${APKANALYZER}" manifest version-name "${APK}")"
          VERSION_CODE="$("${APKANALYZER}" manifest version-code "${APK}")"
          printf '%s\n' "${APP_ID}" | tee report/application_id.txt
          printf '%s\n' "${VERSION_NAME}" | tee report/version_name.txt
          printf '%s\n' "${VERSION_CODE}" | tee report/version_code.txt
          "${APKANALYZER}" manifest print "${APK}" > report/AndroidManifest.xml

          if [ "${APP_ID}" != "com.lynkbey.app" ]; then
            printf 'IDENTITY MISMATCH: expected com.lynkbey.app, received %s\n' "${APP_ID}" \
              | tee report/identity_error.txt
            exit 1
          fi

          keytool -printcert -jarfile "${APK}" > report/signing_keytool.txt 2>&1 || true
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "${APKSIGNER}" ]; then
            "${APKSIGNER}" verify --verbose --print-certs "${APK}" \
              > report/signing_apksigner.txt 2>&1 || true
          fi

          find work/unpacked -maxdepth 5 -type f -printf '%P\t%s bytes\n' \
            | sort > report/apk_inventory.txt
          find work/unpacked -maxdepth 1 -type f -name 'classes*.dex' -printf '%f\t%s bytes\n' \
            | sort > report/dex_inventory.txt
          echo 'verified=true' >> "${GITHUB_OUTPUT}"

      - name: Decompile and scan S8 command paths
        if: steps.verify.outputs.verified == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="${{ steps.acquire.outputs.apk_path }}"
          mkdir -p work/jadx report/relevant_sources report/relevant_assets

          curl -fL --retry 4 --retry-delay 3 \
            https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip \
            -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --threads-count 2 --show-bad-code \
            -d work/jadx "${APK}" > report/jadx.log 2>&1 || true

          if [ -f work/jadx/resources/AndroidManifest.xml ]; then
            cp work/jadx/resources/AndroidManifest.xml report/AndroidManifest-jadx.xml
          fi

          PATTERN='publishDps|publishDpsWithQueryOption|setDps|setDp|sendDp|deviceControl|ThingHomeSdk|TuyaHomeSdk|IThingDevice|ITuyaDevice|command_trans|chargego|selectroom|select_room|zone_clean|part_clean|goto_charge|repositing|power_go|switch_go|break_clean|customize_mode_switch|work_mode|dp_dust|dp_roll_clean|dp_roll_hot|edge_brush_life|roll_brush_life|filter_life|reset.*brush|reset.*filter|consumable|manual.*control|direction.*control|timer.*clean|schedule.*clean|room.*clean|where.*sweep|cistern|suction|dust.*collect|mop.*clean|mop.*dry|product.?id|schema|dpCode|Laser Robot Vacuum'

          {
            echo '=== Decompiled Java/Kotlin/resource matches ==='
            grep -RInE -C 12 --binary-files=without-match "${PATTERN}" \
              work/jadx/sources work/jadx/resources 2>/dev/null || true
          } | head -n 60000 > report/command_keyword_context.txt

          grep -RIlE --binary-files=without-match "${PATTERN}" \
            work/jadx/sources 2>/dev/null | sort | head -n 1000 \
            > report/matched_source_files.txt || true
          while IFS= read -r source; do
            [ -f "${source}" ] || continue
            relative="${source#work/jadx/sources/}"
            mkdir -p "report/relevant_sources/$(dirname "${relative}")"
            cp "${source}" "report/relevant_sources/${relative}"
          done < report/matched_source_files.txt

          find work/unpacked work/jadx/resources -type f \
            \( -name '*.js' -o -name '*.bundle' -o -name '*.json' -o -name '*.html' \
               -o -name '*.xml' -o -name '*.txt' -o -name '*.dart' \) -print0 2>/dev/null \
            | xargs -0 -r grep -IlE --binary-files=without-match "${PATTERN}" \
            | sort | head -n 1000 > report/matched_asset_files.txt || true
          while IFS= read -r asset; do
            [ -f "${asset}" ] || continue
            safe="$(printf '%s' "${asset}" | sed 's#^work/##; s#[/ ]#_#g')"
            cp "${asset}" "report/relevant_assets/${safe}" || true
          done < report/matched_asset_files.txt

          {
            while IFS= read -r -d '' binary; do
              echo "=== ${binary} ==="
              strings -a "${binary}" | grep -iE "${PATTERN}" || true
            done < <(find work/unpacked -type f \
              \( -name 'classes*.dex' -o -name '*.so' -o -name '*.bundle' \) -print0)
          } | sort -u | head -n 50000 > report/binary_command_strings.txt

          grep -RohE --binary-files=without-match \
            'https?://[^"'"'"' <>\\]+' work/jadx/sources work/jadx/resources 2>/dev/null \
            | sed 's/[),;]$//' | sort -u | head -n 10000 > report/endpoints.txt || true

          find work/jadx/resources/assets work/unpacked/assets work/unpacked/lib \
            -type f -printf '%p\t%s bytes\n' 2>/dev/null \
            | sort > report/assets_and_native_inventory.txt || true

          {
            echo '=== APK identity ==='
            cat report/application_id.txt report/version_name.txt report/version_code.txt
            echo
            echo '=== Hash ==='
            cat report/sha256.txt
            echo
            echo '=== Candidate app-owned roots ==='
            find work/jadx/sources -maxdepth 7 -type d 2>/dev/null \
              | grep -Ei '/(lynkbey|linkbey|tuya|thingclips|smartlife|react|flutter|uni)' \
              | sort | head -n 3000 || true
            echo
            echo '=== Match counts ==='
            wc -l report/matched_source_files.txt report/matched_asset_files.txt
          } > report/summary.txt

      - name: Record incomplete acquisition
        if: always() && steps.verify.outputs.verified != 'true'
        shell: bash
        run: |
          test -f report/summary.txt || printf '%s\n' \
            'Exact com.lynkbey.app APK was not yet verified; inspect package-specific POST responses.' \
            > report/summary.txt

      - name: Upload temporary research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s8-linkbey-apk-command-analysis-${{ github.run_number }}
          path: |
            work/apks/*.apk
            report/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 1
