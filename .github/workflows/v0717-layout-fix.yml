name: Apply v0.7.17 layout fix

on:
  push:
    branches:
      - fix/v0717-hero-fill-home-icon
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0717-hero-fill-home-icon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Patch Hero height and Home icon
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          js = Path('custom_components/s8_omni/frontend/s8-omni-panel.js')
          t = js.read_text(encoding='utf-8')
          t = t.replace('const UI_VERSION = "v0.7.16";', 'const UI_VERSION = "v0.7.17";', 1)
          t = t.replace('.state-scene{position:relative;height:330px;', '.state-scene{position:relative;height:388px;', 1)
          t = t.replace('@media(max-width:430px){.state-scene{height:318px}', '@media(max-width:430px){.state-scene{height:376px}', 1)
          t = t.replace('mdi:home-check', 'mdi:home')
          if 'height:388px' not in t or 'height:376px' not in t:
              raise SystemExit('Hero height patch failed')
          if 'mdi:home-check' in t:
              raise SystemExit('home-check icon still present')
          js.write_text(t, encoding='utf-8')

          const = Path('custom_components/s8_omni/const.py')
          c = const.read_text(encoding='utf-8')
          c = c.replace('VERSION = "v1.00_b049"', 'VERSION = "v1.00_b050"', 1)
          c = c.replace('DASHBOARD_VERSION = "v0.7.16"', 'DASHBOARD_VERSION = "v0.7.17"', 1)
          const.write_text(c, encoding='utf-8')

          manifest_path = Path('custom_components/s8_omni/manifest.json')
          m = json.loads(manifest_path.read_text(encoding='utf-8'))
          m['version'] = '1.0.0b50'
          manifest_path.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          panel_path = Path('panel.json')
          p = json.loads(panel_path.read_text(encoding='utf-8'))
          p['panel']['dashboard_version'] = 'v0.7.17'
          panel_path.write_text(json.dumps(p, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          r = r.replace('v1.00_b049` (`1.0.0b49`)', 'v1.00_b050` (`1.0.0b50`)', 1)
          r = r.replace('Dashboard **v0.7.16**', 'Dashboard **v0.7.17**', 1)
          readme.write_text(r, encoding='utf-8')

          checks = Path('.github/workflows/repository-checks.yml')
          q = checks.read_text(encoding='utf-8')
          q = q.replace('const UI_VERSION = "v0.7.16"', 'const UI_VERSION = "v0.7.17"')
          q = q.replace("dashboard_version') != 'v0.7.16'", "dashboard_version') != 'v0.7.17'")
          q = q.replace('S8 OMNI v0.7.16', 'S8 OMNI v0.7.17')
          checks.write_text(q, encoding='utf-8')
          PY
          node --check custom_components/s8_omni/frontend/s8-omni-panel.js
          python -m compileall -q custom_components
          grep -q 'const UI_VERSION = "v0.7.17"' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'height:388px' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'height:376px' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'mdi:home' custom_components/s8_omni/frontend/s8-omni-panel.js
          if grep -q 'mdi:home-check' custom_components/s8_omni/frontend/s8-omni-panel.js; then exit 1; fi
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/s8_omni/frontend/s8-omni-panel.js custom_components/s8_omni/const.py custom_components/s8_omni/manifest.json panel.json README.md .github/workflows/repository-checks.yml
          if ! git diff --cached --quiet; then
            git commit -m "ui: fill Overview viewport and restore Home icon in v0.7.17"
            git push origin HEAD:fix/v0717-hero-fill-home-icon
          fi
