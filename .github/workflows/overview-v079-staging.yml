name: Overview v0.7.9 staging

on:
  push:
    branches:
      - fix/overview-v079-upload
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overview-v079-upload
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply v0.7.9 patch once
        shell: bash
        run: |
          if grep -q 'const UI_VERSION = "v0.7.8"' custom_components/s8_omni/frontend/s8-omni-panel.js; then
            python .github/patch_v079.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/s8_omni/frontend/s8-omni-panel.js
            git commit -m "ui: tune approved Overview composition in v0.7.9"
            git push origin HEAD:fix/overview-v079-upload
          fi
      - name: Validate frontend
        run: |
          node --check custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'const UI_VERSION = "v0.7.9"' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'v0.7.9 approved-render geometry' custom_components/s8_omni/frontend/s8-omni-panel.js
      - name: Validate high-quality hero assets
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('custom_components/s8_omni/frontend/assets')
          for name in ('product-clean.jpg','product-dock.jpg'):
              data=(root/name).read_bytes()
              if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
                  raise SystemExit(f'Invalid JPEG: {name}')
              if len(data) < 25000:
                  raise SystemExit(f'Hero asset too small: {name}: {len(data)}')
              print(name, len(data))
          PY
