name: Rebuild v0.7.9 hero assets

on:
  push:
    branches:
      - fix/overview-v079-upload
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overview-v079-upload
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rebuild verified JPEG assets
        run: |
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path

          chunk_root = Path('.github/asset_chunks')
          asset_root = Path('custom_components/s8_omni/frontend/assets')
          expected = {
              'clean': '17def2bb3f83352e9697d22eb4e0b15545902cd1a0fc703e325df92def9e380f',
              'dock': '0530f58afe28af40c3fe99ab9c2d309a59a30f864cdafd224a4c469e3f2ed723',
          }
          for mode in ('clean', 'dock'):
              parts = sorted(chunk_root.glob(f'{mode}_*.b64'))
              if not parts:
                  raise SystemExit(f'No chunks for {mode}')
              encoded = ''.join(p.read_text(encoding='utf-8') for p in parts)
              data = base64.b64decode(encoded, validate=True)
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected[mode]:
                  raise SystemExit(f'SHA mismatch for {mode}: {digest}')
              if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
                  raise SystemExit(f'Invalid JPEG framing for {mode}')
              if len(data) < 12000:
                  raise SystemExit(f'Unexpectedly small {mode} asset: {len(data)}')
              out = asset_root / f'product-{mode}.jpg'
              out.write_bytes(data)
              print(f'OK {mode}: {len(data)} bytes {digest}')
          PY
      - name: Commit rebuilt assets if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/s8_omni/frontend/assets/product-clean.jpg custom_components/s8_omni/frontend/assets/product-dock.jpg
          if ! git diff --cached --quiet; then
            git commit -m "ui: rebuild verified high-quality hero assets for v0.7.9"
            git push origin HEAD:fix/overview-v079-upload
          fi
