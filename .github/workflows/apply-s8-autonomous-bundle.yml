name: Apply S8 autonomous bundle

on:
  push:
    branches:
      - fix/s8-autonomous-production-bundle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v7
        with:
          ref: fix/s8-autonomous-production-bundle
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply exact migration patch
        run: python scripts/apply_autonomous_bundle_patch.py
      - name: Build autonomous production bundle
        run: python scripts/build_s8_production.py
      - name: Run Python regressions
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify deterministic production output
        run: python scripts/build_s8_production.py --check
      - name: Validate NikaS contract
        run: python scripts/check_nikas_ui_standard.py
      - name: Validate production JavaScript syntax
        run: node --check custom_components/s8_omni/frontend/s8-omni-production.js
      - name: Check patch whitespace
        run: git diff --check
      - name: Remove one-shot migration machinery
        run: git rm -f --ignore-unmatch scripts/apply_autonomous_bundle_patch.py .github/workflows/apply-s8-autonomous-bundle.yml
      - name: Commit final migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix S8 autonomous production bundle (REG-S8-IMPORTS)"
          git push origin HEAD:fix/s8-autonomous-production-bundle
