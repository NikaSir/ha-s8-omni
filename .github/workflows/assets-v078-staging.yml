name: Frontend assets v0.7.8 staging

on:
  push:
    branches:
      - refactor/frontend-assets-v078
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/frontend-assets-v078
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply assets patch once
        shell: bash
        run: |
          if grep -q 'const UI_VERSION = "v0.7.7"' custom_components/s8_omni/frontend/s8-omni-panel.js; then
            python .github/patch_assets_v078.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/s8_omni/frontend/s8-omni-panel.js
            git commit -m "refactor: use centralized local frontend assets in v0.7.8"
            git push origin HEAD:refactor/frontend-assets-v078
          fi
      - name: Validate frontend asset references
        run: |
          node --check custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'const ASSET_ROOT = "/s8_omni/frontend/assets"' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'PRODUCT_CLEAN_IMAGE' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'PRODUCT_DOCK_IMAGE' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q '${ASSET_ROOT}/status-${name}.jpg' custom_components/s8_omni/frontend/s8-omni-panel.js
