name: Apply approved HERO surface
on:
  push:
    branches: [codex/uniform-hero-surface]
    paths: [.github/workflows/hero-surface-check.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'NikaSir/ha-s8-omni' && github.ref == 'refs/heads/codex/uniform-hero-surface'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Replace only the two approved HERO background values
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('custom_components/s8_omni/frontend/s8-omni-panel.js')
          source = p.read_text(encoding='utf-8')
          target = 'color-mix(in srgb,var(--card-background-color,#fff) 95%,var(--primary-color,#03a9d9) 5%)'
          old_values = (
              'linear-gradient(135deg,var(--card-background-color) 62%,color-mix(in srgb,var(--primary-color) 7%,var(--card-background-color)) 100%)',
              'linear-gradient(135deg,var(--card-background-color) 72%,color-mix(in srgb,var(--primary-color) 6%,var(--card-background-color)) 100%)',
          )
          for old in old_values:
              assert source.count(old) == 1, 'Unexpected source drift; refuse broad replacement'
              source = source.replace(old, target, 1)
          p.write_text(source, encoding='utf-8')
          PY
      - name: Rebuild and verify production bundle
        run: |
          python3 scripts/build_s8_production.py
          python3 scripts/build_s8_production.py --check
          python3 tests/test_hero_surface.py
          for module in custom_components/s8_omni/frontend/*.js; do node --check "$module"; done
          git diff --check
      - name: Commit only source and generated runtime to feature branch
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {'custom_components/s8_omni/frontend/s8-omni-panel.js', 'custom_components/s8_omni/frontend/s8-omni-production.js'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/s8_omni/frontend/s8-omni-panel.js custom_components/s8_omni/frontend/s8-omni-production.js
          git commit -m 'fix(ui): use flat five-percent HERO surfaces without tinting photos'
          git push origin HEAD:refs/heads/codex/uniform-hero-surface
