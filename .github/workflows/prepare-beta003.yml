name: Prepare authorized beta003
on:
  push:
    branches: [release/hero-surface-beta003]
    paths: [.github/workflows/prepare-beta003.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor == 'NikaSir' && github.ref == 'refs/heads/release/hero-surface-beta003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Stamp versions, rebuild and verify
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          configs = {
            'ha-s8-omni': ('s8_omni', '1.0.9', '1.0.10', '1.0.11', ['python3','scripts/build_s8_production.py'], 's8-omni-production.js'),
            'ha-ho-sc-8w': ('nikas_ho_sc_8w', '1.1.2', '1.1.3', '1.1.4', None, None),
            'ha-nikas-climate': ('nikas_climate', '0.1.59', '1.4.31', '1.4.32', ['python3','scripts/build-frontend.py'], 'nikas-climate-production.js'),
            'ha-lider-voltage-control': ('lider_voltage_control', '0.8.12', '0.8.12', '0.8.13', ['node','scripts/build-frontend-bundle.mjs'], 'lider-voltage-control-panel.js'),
          }
          domain, base, oldui, newui, build, generated = configs[os.environ['GITHUB_REPOSITORY'].split('/')[1]]
          component = Path('custom_components') / domain
          old, new = base + '-beta002', base + '-beta003'
          manifest = component / 'manifest.json'
          assert json.loads(manifest.read_text())['version'] == old
          candidates = list(component.glob('*.py')) + list((component/'frontend').glob('*.js')) + list((component/'frontend').glob('*.mjs'))
          candidates += [manifest, Path('panel.json'), Path('panel_manifest.json')]
          ui_pattern = re.compile(r'(?<![0-9.])' + re.escape(oldui) + r'(?![0-9A-Za-z.\-])')
          changes = []
          for p in candidates:
            if not p.is_file() or p.name == generated:
              continue
            before = p.read_text(encoding='utf-8')
            after = ui_pattern.sub(newui, before.replace(old, new))
            if after != before:
              print('VERSION METADATA', p, flush=True)
              p.write_text(after, encoding='utf-8')
              changes.append(str(p))
          assert str(manifest) in changes and len(changes) >= 3
          assert json.loads(manifest.read_text())['version'] == new
          if build:
            subprocess.run(build, check=True)
            subprocess.run(build + ['--check'], check=True)
            changes.append(str(component/'frontend'/generated))
          subprocess.run(['python3','tests/test_hero_surface.py'], check=True)
          subprocess.run(['python3','scripts/check_nikas_ui_standard.py'], check=True)
          subprocess.run(['python3','-m','compileall','-q','custom_components'], check=True)
          for p in (component/'frontend').iterdir():
            if p.suffix in ('.js','.mjs'):
              subprocess.run(['node','--check',str(p)], check=True)
          actual = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual == set(changes), actual
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','diff','--stat'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*changes],check=True)
          subprocess.run(['git','commit','-m',f'chore(release): {new}, UI {newui} cache refresh'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/release/hero-surface-beta003'],check=True)
          PY
