name: Apply two-level connection indicator b054

on:
  push:
    branches:
      - feat/connection-freshness-b054
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/connection-freshness-b054
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply_connection_indicator_b054.py
      - name: Validate syntax and contract
        run: |
          node --check custom_components/s8_omni/frontend/s8-omni-panel.js
          python -m compileall -q custom_components
          python - <<'PY'
          import json
          from pathlib import Path
          panel = json.loads(Path('panel.json').read_text(encoding='utf-8'))['panel']
          assert panel['dashboard_version'] == 'v0.7.18'
          contract = panel['availability']['connection_indicator']
          assert contract['stale_after_scan_periods'] == 3
          assert contract['failed_poll_immediately_stale'] is True
          js = Path('custom_components/s8_omni/frontend/s8-omni-panel.js').read_text(encoding='utf-8')
          for marker in ('connection-indicator', 'Данные актуальны', 'Данные устарели', 'data-more="local_connection"'):
              assert marker in js, marker
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/s8_omni/coordinator.py custom_components/s8_omni/binary_sensor.py custom_components/s8_omni/sensor.py custom_components/s8_omni/frontend/s8-omni-panel.js custom_components/s8_omni/const.py custom_components/s8_omni/manifest.json panel.json .github/workflows/repository-checks.yml docs/PROTOCOL.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: add two-level connection freshness indicator"
            git push origin HEAD:feat/connection-freshness-b054
          fi
