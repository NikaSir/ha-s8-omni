name: Apply mode telemetry fix v0.7.11

on:
  push:
    branches:
      - fix/mode-telemetry-v0711
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mode-telemetry-v0711
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Patch mode telemetry semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          js_path = Path('custom_components/s8_omni/frontend/s8-omni-panel.js')
          text = js_path.read_text(encoding='utf-8')
          text = text.replace('const UI_VERSION = "v0.7.10";', 'const UI_VERSION = "v0.7.11";', 1)
          text = text.replace(
              'const MODE_LABELS = { smart: "Smart", zone: "Зона", pose: "Точка", part: "Частичная", chargego: "Возврат", wallfollow: "Вдоль стен", selectroom: "Комнаты" };',
              'const MODE_LABELS = { smart: "Smart", zone: "Зона", pose: "Точка", part: "Частичная", chargego: "Возврат", wallfollow: "Вдоль стен", selectroom: "Комнаты" };\nconst WORK_MODE_LABELS = { both_work: "Комби" };',
              1,
          )
          old = '''  _modeLabel(snap) {\n    if (snap.unreliable) return "Нет данных";\n    const work = String(snap.workMode ?? "").toLowerCase();\n    if (MODE_LABELS[work]) return MODE_LABELS[work];\n    if (snap.mode === "chargego" && snap.onDock === true) return "Нет данных";\n    return this._label(MODE_LABELS, snap.mode, "Нет данных");\n  }'''
          new = '''  _modeLabel(snap) {\n    if (snap.unreliable) return "Нет данных";\n    const mode = String(snap.mode ?? "").toLowerCase();\n    const work = String(snap.workMode ?? "").toLowerCase();\n    if (mode && mode !== "chargego" && MODE_LABELS[mode]) return MODE_LABELS[mode];\n    if (mode === "chargego" && snap.onDock !== true) return MODE_LABELS.chargego;\n    if (WORK_MODE_LABELS[work]) return WORK_MODE_LABELS[work];\n    return this._label(MODE_LABELS, mode || snap.mode, "Нет данных");\n  }\n\n  _modeMeta(snap, label) {\n    if (snap.unreliable) return "Режим недоступен";\n    if (label === "Smart") return "Автовыбор";\n    if (label === "Комби") return "Пылесос + мойка";\n    if (label === "Возврат") return "На станцию";\n    return "Профиль уборки";\n  }'''
          if old not in text:
              raise SystemExit('modeLabel source block not found')
          text = text.replace(old, new, 1)
          old = 'const artMode=chargeActive||wash||dust||dry?"dock":"clean", battery=snap.battery===null?"—":`${Math.round(snap.battery)}%`, age=snap.age===null?"—":this._formatDuration(snap.age), mode=this._modeLabel(snap);'
          new = 'const artMode=chargeActive||wash||dust||dry?"dock":"clean", battery=snap.battery===null?"—":`${Math.round(snap.battery)}%`, age=snap.age===null?"—":this._formatDuration(snap.age), mode=this._modeLabel(snap), modeMeta=this._modeMeta(snap,mode);'
          if old not in text:
              raise SystemExit('hero mode declaration not found')
          text = text.replace(old, new, 1)
          old = '<small>${mode==="Smart"?"Автовыбор":"Профиль уборки"}</small>'
          new = '<small>${escapeHtml(modeMeta)}</small>'
          if old not in text:
              raise SystemExit('hero mode meta markup not found')
          text = text.replace(old, new, 1)
          old = '${this._diagRow("DP4 mode",attrs.mode)}${this._diagRow("DP1 power_go",attrs.power_go)}'
          new = '${this._diagRow("DP4 mode",attrs.mode)}${this._diagRow("DP41 work_mode",snap.connected ? this._stateValue("work_mode") : "unavailable")}${this._diagRow("DP1 power_go",attrs.power_go)}'
          if old not in text:
              raise SystemExit('diagnostics DP4 row not found')
          text = text.replace(old, new, 1)
          js_path.write_text(text, encoding='utf-8')

          const_path = Path('custom_components/s8_omni/const.py')
          c = const_path.read_text(encoding='utf-8').replace('VERSION = "v1.00_b043"', 'VERSION = "v1.00_b044"', 1).replace('DASHBOARD_VERSION = "v0.7.10"', 'DASHBOARD_VERSION = "v0.7.11"', 1)
          const_path.write_text(c, encoding='utf-8')

          manifest_path = Path('custom_components/s8_omni/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '1.0.0b44'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          panel_path = Path('panel.json')
          panel = json.loads(panel_path.read_text(encoding='utf-8'))
          panel['panel']['dashboard_version'] = 'v0.7.11'
          panel_path.write_text(json.dumps(panel, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = Path('README.md')
          r = readme_path.read_text(encoding='utf-8').replace('v1.00_b043` (`1.0.0b43`)', 'v1.00_b044` (`1.0.0b44`)', 1).replace('Dashboard **v0.7.10**', 'Dashboard **v0.7.11**', 1)
          readme_path.write_text(r, encoding='utf-8')

          checks_path = Path('.github/workflows/repository-checks.yml')
          checks = checks_path.read_text(encoding='utf-8')
          needle = "          grep -q 'work_mode' \"$production\"\n"
          addition = needle + "          grep -q 'const WORK_MODE_LABELS = { both_work: \"Комби\" }' \"$production\"\n          grep -q '_modeMeta(snap, label)' \"$production\"\n          grep -q 'DP41 work_mode' \"$production\"\n          if grep -q 'MODE_LABELS\\[work\\]' \"$production\"; then exit 1; fi\n"
          if needle not in checks:
              raise SystemExit('repository checks insertion point not found')
          checks = checks.replace(needle, addition, 1)
          checks_path.write_text(checks, encoding='utf-8')
          PY
          node --check custom_components/s8_omni/frontend/s8-omni-panel.js
          python -m compileall -q custom_components
          grep -q 'const UI_VERSION = "v0.7.11"' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'WORK_MODE_LABELS' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'DP41 work_mode' custom_components/s8_omni/frontend/s8-omni-panel.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/s8_omni/frontend/s8-omni-panel.js custom_components/s8_omni/const.py custom_components/s8_omni/manifest.json panel.json README.md .github/workflows/repository-checks.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix: use verified DP4 and DP41 mode telemetry in v0.7.11"
            git push origin HEAD:fix/mode-telemetry-v0711
          fi
