name: Apply state-aware Hero v0.7.16

on:
  push:
    branches:
      - ui/state-hero-v0716
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/state-hero-v0716
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply production patch
        run: |
          python .github/scripts/apply_state_hero_v0716.py
          node --check custom_components/s8_omni/frontend/s8-omni-panel.js
          python -m compileall -q custom_components
          grep -q 'const UI_VERSION = "v0.7.16"' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'hero-dock.webp' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'hero-dust.webp' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'data-station-stop' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'data-zoom-out' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'StopDesc("stop_dust_collection"' custom_components/s8_omni/button.py
          if grep -q '<section class="card statuses-card"' custom_components/s8_omni/frontend/s8-omni-panel.js; then exit 1; fi
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/s8_omni/frontend/s8-omni-panel.js custom_components/s8_omni/button.py custom_components/s8_omni/const.py custom_components/s8_omni/manifest.json panel.json README.md docs/PROTOCOL.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "ui: ship state-aware Hero in v0.7.16"
            git push origin HEAD:ui/state-hero-v0716
          fi
