name: Diagnose beta003 regressions
on:
  push:
    branches: [release/hero-surface-beta003]
    paths: [.github/workflows/diagnose-beta003.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Summarize exact test failures without dumping source files
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['python3','-m','unittest','discover','-s','tests','-p','test_*.py'],capture_output=True,text=True)
          output = result.stdout + result.stderr
          markers = ('FAIL:', 'ERROR:', '  File ', 'AssertionError:', 'Ran ', 'FAILED', 'OK', 'ImportError:', 'ModuleNotFoundError:')
          for line in output.splitlines():
              if line.startswith(markers):
                  print(line[:350])
          print('EXIT', result.returncode)
          raise SystemExit(result.returncode)
          PY
