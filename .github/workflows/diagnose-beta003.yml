name: Synchronize beta003 test versions
on:
  push:
    branches: [release/hero-surface-beta003]
    paths: [.github/workflows/diagnose-beta003.yml]
permissions:
  contents: write
jobs:
  synchronize:
    if: github.actor == 'NikaSir' && github.repository == 'NikaSir/ha-s8-omni'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Change only inspected version literals and rerun full regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
            'tests/test_autonomous_production_bundle.py': '4ebcc9b0345463361d8447baff0375336be9206a',
            'tests/test_panel_current_rules_ui_v0733.py': '3d1e918dba45d7d557c0b175d89ff08680018b31',
            'tests/test_panel_dynamic_actions_ui_v0723.py': 'bf92234afe84961431d7e2e897e51087a03911f5',
            'tests/test_panel_overview_ui_v0727.py': '32bf48f6b5a2214fe0b56b4fcde112a1b107b0b6',
          }
          for name, sha in expected.items():
            assert subprocess.check_output(['git','hash-object',name],text=True).strip() == sha, name
            p = Path(name)
            before = p.read_text(encoding='utf-8')
            after = before.replace('1.0.10','1.0.11').replace('1.0.9-beta002','1.0.9-beta003')
            assert before != after
            p.write_text(after,encoding='utf-8')
          result = subprocess.run(['python3','-m','unittest','discover','-s','tests','-p','test_*.py'],capture_output=True,text=True)
          for line in (result.stdout + result.stderr).splitlines():
            if line.startswith(('FAIL:', 'ERROR:', '  File ', 'AssertionError:', 'Ran ', 'FAILED', 'OK')):
              print(line[:350])
          assert result.returncode == 0, 'Full regressions must pass before committing'
          subprocess.run(['python3','scripts/build_s8_production.py','--check'],check=True)
          actual = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual == set(expected), actual
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','diff','--stat'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*expected],check=True)
          subprocess.run(['git','commit','-m','test(release): synchronize beta003 and UI 1.0.11 assertions'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/release/hero-surface-beta003'],check=True)
          PY
