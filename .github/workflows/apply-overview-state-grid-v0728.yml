name: Apply S8 Overview state-grid v0.7.28

on:
  push:
    branches:
      - fix/overview-state-grid-v0728

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[state-grid-v0728-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/overview-state-grid-v0728
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch
        run: python tools/apply_overview_state_grid_v0728.py
      - name: Validate frontend syntax
        run: node --check custom_components/s8_omni/frontend/s8-omni-panel.js
      - name: Run current tests
        run: |
          python -m compileall -q custom_components
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit patched production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/s8_omni/frontend/s8-omni-panel.js \
                  custom_components/s8_omni/const.py \
                  custom_components/s8_omni/manifest.json \
                  panel.json \
                  tests/test_panel_dynamic_actions_ui_v0723.py \
                  tests/test_panel_overview_ui_v0727.py \
                  CHANGELOG.md
          git diff --cached --check
          git commit -m "Fix live Overview state grid v0.7.28 [state-grid-v0728-applied]"
          git push origin HEAD:fix/overview-state-grid-v0728
