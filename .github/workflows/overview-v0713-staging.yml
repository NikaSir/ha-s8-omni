name: Align Overview v0.7.13 metadata

on:
  push:
    branches:
      - fix/overview-polish-v0713
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overview-polish-v0713
      - name: Align README version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'> Current development line: \*\*v1\.00_b\d+\*\* \(`1\.0\.0b\d+`\)',
              '> Current development line: **v1.00_b046** (`1.0.0b46`)',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('README development-line marker not found')
          if 'Dashboard **v0.7.13**' not in text:
              raise SystemExit('README dashboard version mismatch')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit metadata alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: align b046 / UI v0.7.13 metadata"
            git push origin HEAD:fix/overview-polish-v0713
          fi
