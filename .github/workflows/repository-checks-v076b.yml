name: Overview v0.7.6 compact staging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-v076b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply compact patches once
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          if grep -q 'const UI_VERSION = "v0.7.5"' custom_components/s8_omni/frontend/s8-omni-panel.js; then
            python .github/patch_v076_backend.py
            python .github/patch_v076_ui.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ui: implement approved Overview composition in v0.7.6"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Validate production
        shell: bash
        run: |
          python -m compileall -q custom_components
          node --check custom_components/s8_omni/frontend/s8-omni-panel.js
          js=custom_components/s8_omni/frontend/s8-omni-panel.js
          init=custom_components/s8_omni/__init__.py
          grep -q 'const UI_VERSION = "v0.7.6"' "$js"
          grep -q 'productArtUrl(artMode)' "$js"
          grep -q 'class S8ProductArtView' "$init"
          grep -q 'requires_auth = False' "$init"
          grep -q 'Чистая вода' "$js"
          grep -q 'Грязная вода' "$js"
          grep -q 'Пылесборник' "$js"
          if grep -q 'src="${productArtData' "$js"; then exit 1; fi
      - name: Validate embedded JPEGs
        run: |
          python - <<'PY'
          import base64,re
          from pathlib import Path
          t=Path('custom_components/s8_omni/frontend/s8-omni-panel.js').read_text()
          for n in ('PRODUCT_ART_CLEAN_BASE64','PRODUCT_ART_DOCK_BASE64'):
              m=re.search(rf'const {n} = "([^"]+)";',t); assert m
              b=base64.b64decode(m.group(1),validate=True)
              assert b[:2]==b'\xff\xd8' and b[-2:]==b'\xff\xd9' and len(b)>10000
              print(n,len(b))
          PY
