name: Apply gesture canvas v0.7.15

on:
  push:
    branches:
      - feat/gesture-canvas-v0715
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gesture-canvas-v0715
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Add deferred-render gesture guard
        run: |
          python .github/scripts/patch_gesture_deferred_render.py
          node --check custom_components/s8_omni/frontend/s8-omni-panel.js
          python -m compileall -q custom_components
          grep -q 'this._renderDeferred = false' custom_components/s8_omni/frontend/s8-omni-panel.js
          grep -q 'this._gesturePointers?.size' custom_components/s8_omni/frontend/s8-omni-panel.js
      - name: Commit production guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/s8_omni/frontend/s8-omni-panel.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: defer panel rerender until gesture completes"
            git push origin HEAD:feat/gesture-canvas-v0715
          fi
