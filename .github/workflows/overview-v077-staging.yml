name: Overview v0.7.7 staging

on:
  push:
    branches:
      - fix/overview-v077-static-jpeg
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overview-v077-static-jpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply v0.7.7 patch once
        shell: bash
        run: |
          if grep -q 'const UI_VERSION = "v0.7.6"' custom_components/s8_omni/frontend/s8-omni-panel.js; then
            python .github/patch_v077.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/s8_omni/frontend/s8-omni-panel.js
            git commit -m "ui: use static product art and product status cards in v0.7.7"
            git push origin HEAD:fix/overview-v077-static-jpeg
          fi
      - name: Validate JavaScript and Python
        run: |
          node --check custom_components/s8_omni/frontend/s8-omni-panel.js
          python -m compileall -q custom_components
      - name: Validate static visual assets
        run: |
          python - <<'PY'
          from pathlib import Path
          names = [
              'product-clean.jpg','product-dock.jpg','status-robot.jpg',
              'status-station.jpg','status-water.jpg','status-dustbin.jpg'
          ]
          root=Path('custom_components/s8_omni/frontend')
          for name in names:
              data=(root/name).read_bytes()
              if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
                  raise SystemExit(f'Invalid JPEG: {name}')
              print(name, len(data))
          text=(root/'s8-omni-panel.js').read_text(encoding='utf-8')
          required=['v0.7.7','/s8_omni/frontend/product-','status-${name}.jpg','status-thumb','work_mode']
          for item in required:
              if item not in text: raise SystemExit(f'Missing contract marker: {item}')
          forbidden=['PRODUCT_ART_CLEAN_BASE64','PRODUCT_ART_DOCK_BASE64','/s8_omni/product-art/','data:image/jpeg;base64']
          for item in forbidden:
              if item in text: raise SystemExit(f'Legacy delivery remains: {item}')
          PY
