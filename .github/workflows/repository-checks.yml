name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"OK {path}")
          PY
      - name: Compile Python sources
        run: python -m compileall -q custom_components scripts tests
      - name: Validate bundled JavaScript syntax
        run: node --check custom_components/s8_omni/frontend/s8-omni-panel.js
      - name: Enforce NikaS v2.2 contract
        run: python scripts/check_nikas_ui_standard.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify host-bound Shell v2.1 markers
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("custom_components/s8_omni/frontend/s8-omni-panel.js").read_text(encoding="utf-8")
          for forbidden in ("100vh", "100dvh", "/dashboard-house-v11"):
              assert forbidden not in source, forbidden
          for required in (
              'const UI_VERSION = "v0.7.41"',
              "/dashboard-house-v13/home",
              "/dashboard-rooms-v11/rooms",
              "createNikasShellScrollBoundaryGuard",
              'host.addEventListener("touchmove", moveTouch, { passive: false, capture: true })',
              "--mdc-icon-size:26px",
              "<strong>Пылесос</strong>",
              '"Диагностика"',
          ):
              assert required in source, required
          PY
      - name: Reject tracked credential/key files
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(secrets\.yaml|\.env($|\.)|.*\.(pem|key|p12)$)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden" ]; then
            echo 'Forbidden credential/key-like files are tracked:'
            echo "$forbidden"
            exit 1
          fi
