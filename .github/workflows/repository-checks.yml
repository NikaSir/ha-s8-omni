name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"OK {path}")
          PY
      - name: Compile Python sources
        run: python -m compileall -q custom_components scripts tests
      - name: Verify autonomous production bundle
        run: python scripts/build_s8_production.py --check
      - name: Validate bundled JavaScript syntax
        run: |
          for module in custom_components/s8_omni/frontend/*.js; do
            node --check "$module"
          done
      - name: Enforce NikaS v2.2 contract
        run: python scripts/check_nikas_ui_standard.py
      - name: Run regressions including production command-readback chain
        run: |
          node tests/test_title_parent.cjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify host-bound Shell v2.1 markers
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("custom_components/s8_omni/frontend/s8-omni-production.js").read_text(encoding="utf-8")
          for forbidden in ("100vh", "100dvh", "/dashboard-house-v11"):
              assert forbidden not in source, forbidden
          for required in (
              'const UI_VERSION = "v1.0.12"',
              "/dashboard-house-v13/home",
              "/dashboard-rooms-v11/rooms",
              "createNikasShellScrollBoundaryGuard",
              'host.addEventListener("touchmove", moveTouch, { passive: false, capture: true })',
              "--mdc-icon-size:26px",
              "<strong>Пылесос</strong>",
              '"Диагностика"',
          ):
              assert required in source, required
          PY
      - name: Reject tracked credential/key files
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(secrets\.yaml|\.env($|\.)|.*\.(pem|key|p12)$)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden" ]; then
            echo 'Forbidden credential/key-like files are tracked:'
            echo "$forbidden"
            exit 1
          fi
      - name: Verify pinned standard documents
        run: |
          python scripts/check_standard_documents.py
          python tests/test_standard_document_sync.py

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned browser test dependency
        shell: bash
        run: |
          s8_ui_test_deps="${RUNNER_TEMP}/s8-ui-browser-tests"
          npm install --prefix "$s8_ui_test_deps" --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          echo "NODE_PATH=$s8_ui_test_deps/node_modules" >> "$GITHUB_ENV"
          node "$s8_ui_test_deps/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise autonomous production bundle in Chromium
        run: node tests/ui/panel-regression.mjs

  hacs-validation:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate integration repository with HACS
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate integration with Hassfest
        uses: home-assistant/actions/hassfest@master

  validate:
    if: ${{ always() }}
    needs: [repository-checks, hacs-validation, hassfest]
    runs-on: ubuntu-latest
    steps:
      - name: Require repository checks, HACS, and Hassfest to pass
        shell: bash
        env:
          S8_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYGATE'
          import json
          import os
          import sys

          required = {"repository-checks", "hacs-validation", "hassfest"}
          results = json.loads(os.environ["S8_JOB_RESULTS"])
          if set(results) != required:
              sys.exit("Required CI job results are missing or unexpected")
          failed = {name: results[name].get("result") for name in sorted(required)
                    if results[name].get("result") != "success"}
          if failed:
              sys.exit(f"Required CI jobs did not succeed: {failed}")
          print("Repository checks, HACS, and Hassfest succeeded; device acceptance remains separate.")
          PYGATE
