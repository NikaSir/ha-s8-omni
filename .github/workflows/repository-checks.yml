name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts:
                  continue
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'OK {path}')
          PY

      - name: Compile Python sources when present
        run: |
          if [ -d custom_components ]; then
            python -m compileall -q custom_components
          fi

      - name: Validate frontend JavaScript when present
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find custom_components -type f -name '*.js' -print0 2>/dev/null || true)

      - name: Enforce standalone S8 OMNI production frontend
        shell: bash
        run: |
          frontend_dir="custom_components/s8_omni/frontend"
          production="$frontend_dir/s8-omni-panel.js"
          registration="custom_components/s8_omni/__init__.py"

          test -f "$production" || { echo "Missing production bundle: $production"; exit 1; }
          test ! -f "$frontend_dir/omni-product-v071.webp" || { echo "Secondary product-art file must not be required by production"; exit 1; }

          js_count="$(find "$frontend_dir" -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')"
          if [ "$js_count" != "1" ]; then
            echo "Expected exactly one production JS file in $frontend_dir; found $js_count"
            exit 1
          fi

          if grep -nE '^[[:space:]]*import[[:space:]]' "$production"; then
            echo "Production panel bundle must not use runtime imports"
            exit 1
          fi

          if grep -nE 's8-omni-panel-v[0-9]+\.js' "$production" "$registration"; then
            echo "Historical panel versions must not be production runtime dependencies"
            exit 1
          fi

          grep -q 's8-omni-panel\.js?v=' "$registration" || { echo "Stable panel module cache busting missing"; exit 1; }
          grep -q 'const PRODUCT_ART_BASE64 = "UklG' "$production" || { echo "Embedded verified WebP product art missing"; exit 1; }
          grep -q 'URL.createObjectURL(new Blob' "$production" || { echo "Blob URL product-art delivery missing"; exit 1; }
          grep -q 'src="${productArtUrl()}"' "$production" || { echo "Product image is not using Blob URL"; exit 1; }

          echo "Standalone frontend and embedded product-art contract OK"

      - name: Enforce offline-safe S8 OMNI panel lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("custom_components/s8_omni/__init__.py")
          text = path.read_text(encoding="utf-8")
          try:
              setup = text.split("async def async_setup_entry", 1)[1].split("async def async_unload_entry", 1)[0]
          except IndexError as err:
              raise SystemExit("Unable to locate S8 OMNI setup lifecycle") from err
          if "async_config_entry_first_refresh" in setup:
              raise SystemExit("S8 OMNI setup must not gate panel registration on first refresh")
          markers = [
              "await _async_register_panel(hass, entry)",
              "await hass.config_entries.async_forward_entry_setups(entry, PLATFORMS)",
              "await coordinator.async_refresh()",
          ]
          positions = [setup.find(marker) for marker in markers]
          if any(pos < 0 for pos in positions) or positions != sorted(positions):
              raise SystemExit("Lifecycle order must be panel registration -> platform setup -> non-gating device refresh")
          print("Offline-safe panel lifecycle contract OK")
          PY

      - name: Reject tracked credential/key files
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(secrets\.yaml|\.env($|\.)|.*\.(pem|key|p12)$)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden" ]; then
            echo 'Forbidden credential/key-like files are tracked:'
            echo "$forbidden"
            exit 1
          fi
