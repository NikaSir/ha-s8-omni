name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text(encoding='utf-8'))
                  print(f'OK {path}')
          PY

      - name: Compile Python sources
        run: python -m compileall -q custom_components

      - name: Validate frontend JavaScript
        run: node --check custom_components/s8_omni/frontend/s8-omni-panel.js

      - name: Enforce S8 OMNI local frontend-assets contract
        shell: bash
        run: |
          frontend_dir="custom_components/s8_omni/frontend"
          assets_dir="$frontend_dir/assets"
          production="$frontend_dir/s8-omni-panel.js"
          registration="custom_components/s8_omni/__init__.py"
          test -f "$production"
          test -d "$assets_dir"
          for file in product-clean.jpg product-dock.jpg status-robot.jpg status-station.jpg status-water.jpg status-dustbin.jpg; do
            test -f "$assets_dir/$file" || { echo "Missing asset: $file"; exit 1; }
          done
          test ! -f "$frontend_dir/product-clean.jpg"
          test ! -f "$frontend_dir/product-dock.jpg"
          js_count="$(find "$frontend_dir" -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')"
          test "$js_count" = "1"
          if grep -nE '^[[:space:]]*import[[:space:]]' "$production"; then exit 1; fi
          if grep -nE 's8-omni-panel-v[0-9]+\.js' "$production" "$registration"; then exit 1; fi
          grep -q 's8-omni-panel\.js?v=' "$registration"
          grep -q 'const UI_VERSION = "v0.7.10"' "$production"
          grep -q 'v0.7.10 approved-render geometry' "$production"
          grep -q 'const ASSET_ROOT = "/s8_omni/frontend/assets"' "$production"
          grep -q 'PRODUCT_CLEAN_IMAGE' "$production"
          grep -q 'PRODUCT_DOCK_IMAGE' "$production"
          grep -q '${ASSET_ROOT}/status-${name}.jpg' "$production"
          grep -q 'status-thumb' "$production"
          grep -q 'work_mode' "$production"
          grep -q 'Чистая вода' "$production"
          grep -q 'Грязная вода' "$production"
          grep -q 'Пыль/мешок' "$production"
          grep -q 'Тёплый воздух' "$production"
          grep -q 'Зарядка' "$production"
          grep -q '<strong>Пылесборник</strong>' "$production"
          if grep -q 'PRODUCT_ART_CLEAN_BASE64' "$production"; then exit 1; fi
          if grep -q 'PRODUCT_ART_DOCK_BASE64' "$production"; then exit 1; fi
          if grep -q '/s8_omni/product-art/' "$production"; then exit 1; fi
          if grep -q 'data:image' "$production"; then exit 1; fi
          if grep -q 'createImageBitmap' "$production"; then exit 1; fi
          if grep -q 'S8ProductArtView' "$registration"; then exit 1; fi
          if grep -q '_product_art_bytes' "$registration"; then exit 1; fi
          echo "S8 OMNI v0.7.10 local frontend-assets contract OK"

      - name: Validate panel asset manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/s8_omni/frontend')
          panel = json.loads(Path('panel.json').read_text(encoding='utf-8'))['panel']
          if panel.get('dashboard_version') != 'v0.7.10':
              raise SystemExit('panel.json dashboard_version mismatch')
          frontend = panel['frontend']
          if frontend.get('asset_root') != 'frontend/assets':
              raise SystemExit('panel.json asset_root mismatch')
          assets = frontend.get('assets', [])
          expected = {
              'assets/product-clean.jpg','assets/product-dock.jpg',
              'assets/status-robot.jpg','assets/status-station.jpg',
              'assets/status-water.jpg','assets/status-dustbin.jpg',
          }
          if set(assets) != expected:
              raise SystemExit(f'panel.json assets mismatch: {assets}')
          for rel in assets:
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f'Manifest asset missing: {path}')
          print('Panel asset manifest OK')
          PY

      - name: Validate static JPEG assets
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('custom_components/s8_omni/frontend/assets')
          files=[
              ('product-clean.jpg',12000,'17def2bb3f83352e9697d22eb4e0b15545902cd1a0fc703e325df92def9e380f'),
              ('product-dock.jpg',12000,'0530f58afe28af40c3fe99ab9c2d309a59a30f864cdafd224a4c469e3f2ed723'),
              ('status-robot.jpg',800,None),('status-station.jpg',800,None),
              ('status-water.jpg',800,None),('status-dustbin.jpg',800,None),
          ]
          for name,min_size,expected_sha in files:
              data=(root/name).read_bytes()
              if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
                  raise SystemExit(f'Invalid JPEG: {name}')
              if len(data) < min_size:
                  raise SystemExit(f'Suspiciously small JPEG: {name}: {len(data)}')
              digest=hashlib.sha256(data).hexdigest()
              if expected_sha and digest != expected_sha:
                  raise SystemExit(f'Unexpected hero asset SHA: {name}: {digest}')
              print(f'OK {name}: {len(data)} bytes {digest}')
          PY

      - name: Enforce offline-safe panel lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('custom_components/s8_omni/__init__.py').read_text(encoding='utf-8')
          setup=text.split('async def async_setup_entry',1)[1].split('async def async_unload_entry',1)[0]
          if 'async_config_entry_first_refresh' in setup: raise SystemExit('first refresh must not gate setup')
          markers=['await _async_register_panel(hass, entry)','await hass.config_entries.async_forward_entry_setups(entry, PLATFORMS)','await coordinator.async_refresh()']
          pos=[setup.find(x) for x in markers]
          if any(x<0 for x in pos) or pos!=sorted(pos): raise SystemExit('invalid lifecycle order')
          print('Offline-safe lifecycle OK')
          PY

      - name: Reject tracked credential/key files
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -E '(^|/)(secrets\.yaml|\.env($|\.)|.*\.(pem|key|p12)$)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$forbidden" ]; then echo "$forbidden"; exit 1; fi
