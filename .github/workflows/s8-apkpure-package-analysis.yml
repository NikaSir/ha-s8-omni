name: S8 APKPure package analysis

on:
  push:
    branches:
      - research/s8-apk-command-analysis-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact public package
        id: acquire
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/apk report/acquisition
          python -m pip install --disable-pip-version-check requests
          python <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import pathlib
          import urllib.parse
          import zipfile

          import requests

          TARGET = pathlib.Path("work/apk/Packages_1.2.7_127.apk")
          REPORT = pathlib.Path("report/acquisition")
          TARGET.parent.mkdir(parents=True, exist_ok=True)
          REPORT.mkdir(parents=True, exist_ok=True)

          signed_path = (
              "/b/APK/Y29tLmx5bmtiZXkuYXBwXzEyN180NzZiYmJhYw"
              "?as2=8af5b9419e1f8f5a25b05bc05f5055996c753ee6"
              "&k=78cf907cde5d0501f39051697e93d40d6c753ee6"
              "&_p=Y29tLmx5bmtiZXkuYXBw"
              "&c=1%7CLIFESTYLE%7Cb2lkPTkmZGV2PSVFNSU4RSVBNiVFOSU5NyVBOCVFOSVBMiU4NiVFOCVCNCU5RCVFNiU5QyVCQSVFNSU5OSVBOCVFNCVCQSVCQSVFNiU5QyU4OSVFOSU5OSU5MCVFNSU4NSVBQyVFNSU4RiVCOCZ0PWFwayZzPTc1NTczMDI1JnZuPTEuMi43JnZjPTEyNw"
              "&_fn=JUU5JUEyJTg2JUU4JUI0JTlEJUU2JTlDJUJBJUU1JTk5JUE4JUU0JUJBJUJBXzEuMi43X2Fwa2NvbWJvLmNvbS5hcGs%3D"
          )
          urls = [
              "https://d.apkpure.com/b/APK/com.lynkbey.app?version=latest",
              "https://d.apkpure.com/b/APK/com.lynkbey.app?version=1.2.7",
              "https://download.pureapk.com" + signed_path,
              "https://d.apkpure.com" + signed_path,
              "https://download.apkpure.com" + signed_path,
              "https://d.apkpure.net" + signed_path,
          ]
          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/126.0.0.0 Safari/537.36"
              ),
              "Accept": "application/vnd.android.package-archive,application/octet-stream,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Accept-Encoding": "identity",
          }
          logs: list[str] = []

          def log(message: str) -> None:
              print(message, flush=True)
              logs.append(message)

          def valid_apk(path: pathlib.Path) -> bool:
              if not path.is_file() or path.stat().st_size < 10_000_000:
                  return False
              try:
                  with zipfile.ZipFile(path) as archive:
                      names = set(archive.namelist())
                  return "AndroidManifest.xml" in names and any(
                      name.endswith(".dex") for name in names
                  )
              except zipfile.BadZipFile:
                  return False

          session = requests.Session()
          session.headers.update(headers)
          referers = (None, "https://apkpure.com/", "https://apkcombo.com/")

          for url_index, url in enumerate(urls, 1):
              for ref_index, referer in enumerate(referers, 1):
                  current_headers = {}
                  if referer:
                      current_headers["Referer"] = referer
                  try:
                      with session.get(
                          url,
                          headers=current_headers,
                          timeout=300,
                          allow_redirects=True,
                          stream=True,
                      ) as response:
                          log(
                              f"url={url_index} ref={ref_index} status={response.status_code} "
                              f"host={urllib.parse.urlparse(response.url).hostname} "
                              f"path={urllib.parse.urlparse(response.url).path} "
                              f"type={response.headers.get('content-type')!r} "
                              f"length={response.headers.get('content-length')!r}"
                          )
                          (REPORT / f"headers-{url_index}-{ref_index}.txt").write_text(
                              "\n".join(f"{key}: {value}" for key, value in response.headers.items()),
                              encoding="utf-8",
                          )
                          response.raise_for_status()
                          with TARGET.open("wb") as output:
                              total = 0
                              prefix = b""
                              for chunk in response.iter_content(chunk_size=1024 * 1024):
                                  if not chunk:
                                      continue
                                  if not prefix:
                                      prefix = chunk[:4]
                                  output.write(chunk)
                                  total += len(chunk)
                          log(f"downloaded={total} prefix={prefix!r}")
                          if valid_apk(TARGET):
                              digest = hashlib.sha256(TARGET.read_bytes()).hexdigest()
                              log(f"VALID APK size={TARGET.stat().st_size} sha256={digest}")
                              break
                          body = TARGET.read_bytes()[:500_000]
                          (REPORT / f"body-{url_index}-{ref_index}.bin").write_bytes(body)
                          TARGET.unlink(missing_ok=True)
                  except Exception as exc:  # noqa: BLE001
                      log(f"url={url_index} ref={ref_index} failed: {exc!r}")
                      TARGET.unlink(missing_ok=True)
              if valid_apk(TARGET):
                  break

          (REPORT / "download.log").write_text("\n".join(logs), encoding="utf-8")
          found = valid_apk(TARGET)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"found={'true' if found else 'false'}\n")
              if found:
                  output.write(f"apk={TARGET}\n")
          PY

      - name: Verify exact application identity
        id: verify
        if: steps.acquire.outputs.found == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="${{ steps.acquire.outputs.apk }}"
          mkdir -p report work/unpacked
          APKANALYZER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" \
            -type f -name apkanalyzer 2>/dev/null | head -1)"
          APP_ID="$("${APKANALYZER}" manifest application-id "${APK}")"
          VERSION_NAME="$("${APKANALYZER}" manifest version-name "${APK}")"
          VERSION_CODE="$("${APKANALYZER}" manifest version-code "${APK}")"
          printf '%s\n' "${APP_ID}" | tee report/application_id.txt
          printf '%s\n' "${VERSION_NAME}" | tee report/version_name.txt
          printf '%s\n' "${VERSION_CODE}" | tee report/version_code.txt
          test "${APP_ID}" = "com.lynkbey.app"
          "${APKANALYZER}" manifest print "${APK}" > report/AndroidManifest.xml
          sha256sum "${APK}" | tee report/sha256.txt
          sha1sum "${APK}" | tee report/sha1.txt
          stat --printf='size_bytes=%s\n' "${APK}" | tee report/size.txt
          keytool -printcert -jarfile "${APK}" > report/signing_keytool.txt 2>&1 || true
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "${APKSIGNER}" ]; then
            "${APKSIGNER}" verify --verbose --print-certs "${APK}" \
              > report/signing_apksigner.txt 2>&1 || true
          fi
          unzip -q "${APK}" -d work/unpacked
          find work/unpacked -maxdepth 6 -type f -printf '%P\t%s bytes\n' \
            | sort > report/apk_inventory.txt
          echo 'ok=true' >> "${GITHUB_OUTPUT}"

      - name: Decompile and extract protocol implementation
        if: steps.verify.outputs.ok == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="${{ steps.acquire.outputs.apk }}"
          mkdir -p work/jadx report/relevant_sources report/relevant_assets
          curl -fL --retry 4 --retry-delay 3 \
            https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip \
            -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --threads-count 2 --show-bad-code \
            -d work/jadx "${APK}" > report/jadx.log 2>&1 || true

          PATTERN='publishDps|publishDpsWithQueryOption|setDps|setDp|sendDp|deviceControl|ThingHomeSdk|TuyaHomeSdk|IThingDevice|ITuyaDevice|command_trans|chargego|selectroom|select_room|zone_clean|part_clean|goto_charge|repositing|power_go|switch_go|break_clean|customize_mode_switch|work_mode|dp_dust|dp_roll_clean|dp_roll_hot|edge_brush_life|roll_brush_life|filter_life|reset.*brush|reset.*filter|consumable|manual.*control|direction.*control|timer.*clean|schedule.*clean|room.*clean|where.*sweep|cistern|suction|dust.*collect|mop.*clean|mop.*dry|product.?id|schema|dpCode|Laser Robot Vacuum'

          grep -RInE -C 16 --binary-files=without-match "${PATTERN}" \
            work/jadx/sources work/jadx/resources 2>/dev/null \
            | head -n 100000 > report/command_keyword_context.txt || true
          grep -RIlE --binary-files=without-match "${PATTERN}" \
            work/jadx/sources 2>/dev/null | sort | head -n 2000 \
            > report/matched_source_files.txt || true
          while IFS= read -r source; do
            [ -f "${source}" ] || continue
            relative="${source#work/jadx/sources/}"
            mkdir -p "report/relevant_sources/$(dirname "${relative}")"
            cp "${source}" "report/relevant_sources/${relative}"
          done < report/matched_source_files.txt

          find work/unpacked work/jadx/resources -type f \
            \( -name '*.js' -o -name '*.bundle' -o -name '*.json' -o -name '*.html' \
               -o -name '*.xml' -o -name '*.txt' -o -name '*.dart' \) -print0 2>/dev/null \
            | xargs -0 -r grep -IlE --binary-files=without-match "${PATTERN}" \
            | sort | head -n 2000 > report/matched_asset_files.txt || true
          while IFS= read -r asset; do
            [ -f "${asset}" ] || continue
            safe="$(printf '%s' "${asset}" | sed 's#^work/##; s#[/ ]#_#g')"
            cp "${asset}" "report/relevant_assets/${safe}" || true
          done < report/matched_asset_files.txt

          {
            while IFS= read -r -d '' binary; do
              echo "=== ${binary} ==="
              strings -a "${binary}" | grep -iE "${PATTERN}" || true
            done < <(find work/unpacked -type f \
              \( -name 'classes*.dex' -o -name '*.so' -o -name '*.bundle' \) -print0)
          } | sort -u | head -n 80000 > report/binary_command_strings.txt

          grep -RohE --binary-files=without-match \
            'https?://[^"'"'"' <>\\]+' work/jadx/sources work/jadx/resources 2>/dev/null \
            | sed 's/[),;]$//' | sort -u | head -n 15000 > report/endpoints.txt || true
          find work/jadx/resources/assets work/unpacked/assets work/unpacked/lib \
            -type f -printf '%p\t%s bytes\n' 2>/dev/null \
            | sort > report/assets_and_native_inventory.txt || true

          {
            echo '=== Identity ==='
            cat report/application_id.txt report/version_name.txt report/version_code.txt
            echo
            echo '=== Hash ==='
            cat report/sha256.txt
            echo
            echo '=== Match counts ==='
            wc -l report/matched_source_files.txt report/matched_asset_files.txt
          } > report/summary.txt

      - name: Record unresolved package
        if: always() && steps.verify.outputs.ok != 'true'
        shell: bash
        run: |
          test -f report/summary.txt || printf '%s\n' \
            'Exact Linkbey package was not acquired from package-specific APKPure endpoints.' \
            > report/summary.txt

      - name: Upload temporary analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s8-apkpure-package-analysis-${{ github.run_number }}
          path: |
            work/apk/*.apk
            report/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
