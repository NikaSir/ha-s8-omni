name: S8 APKPure deep command source export

on:
  push:
    branches:
      - research/s8-apk-command-analysis-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download verified LINKBEY package
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/apk report/acquisition
          python -m pip install --disable-pip-version-check requests
          python <<'PY'
          from __future__ import annotations

          import hashlib
          import pathlib
          import zipfile

          import requests

          target = pathlib.Path("work/apk/Packages_1.2.7_127.apk")
          url = "https://d.apkpure.com/b/APK/com.lynkbey.app?version=latest"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36",
              "Accept": "application/vnd.android.package-archive,application/octet-stream,*/*;q=0.8",
              "Accept-Encoding": "identity",
          }
          with requests.get(url, headers=headers, timeout=300, stream=True) as response:
              response.raise_for_status()
              with target.open("wb") as output:
                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          output.write(chunk)
              pathlib.Path("report/acquisition/headers.txt").write_text(
                  "\n".join(f"{key}: {value}" for key, value in response.headers.items()),
                  encoding="utf-8",
              )
          if target.stat().st_size < 10_000_000:
              raise SystemExit("Downloaded file is too small")
          with zipfile.ZipFile(target) as archive:
              names = set(archive.namelist())
          if "AndroidManifest.xml" not in names or not any(name.endswith(".dex") for name in names):
              raise SystemExit("Downloaded file is not a valid APK")
          pathlib.Path("report/sha256.txt").write_text(
              hashlib.sha256(target.read_bytes()).hexdigest() + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify package and signature
        shell: bash
        run: |
          set -Eeuo pipefail
          APK=work/apk/Packages_1.2.7_127.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKANALYZER="$(find "$SDK" -type f -name apkanalyzer 2>/dev/null | head -1)"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          test "$APP_ID" = "com.lynkbey.app"
          printf 'application_id=%s\nversion_name=%s\nversion_code=%s\n' \
            "$APP_ID" "$VERSION_NAME" "$VERSION_CODE" > report/package.txt
          "$APKANALYZER" manifest print "$APK" > report/AndroidManifest.xml
          keytool -printcert -jarfile "$APK" > report/signing_keytool.txt 2>&1 || true
          if [[ -n "$APKSIGNER" ]]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK" > report/signing_apksigner.txt 2>&1 || true
          fi

      - name: Decompile with JADX
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip \
            -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          mkdir -p work/jadx
          /tmp/jadx/bin/jadx --threads-count 2 --show-bad-code \
            -d work/jadx work/apk/Packages_1.2.7_127.apk > report/jadx.log 2>&1 || true

      - name: Export first-party source and command evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p report/first_party_sources report/resources report/hermes

          test -d work/jadx/sources/com/lynkbey
          cp -a work/jadx/sources/com/lynkbey report/first_party_sources/

          for path in \
            work/jadx/resources/assets/index.android.bundle \
            work/jadx/resources/assets/index.js \
            work/jadx/resources/assets/index.html \
            work/jadx/resources/res/values/strings.xml \
            work/jadx/resources/res/xml; do
            if [[ -e "$path" ]]; then
              cp -a --parents "$path" report/resources/
            fi
          done

          find report/first_party_sources -type f -name '*.java' -printf '%P\t%s bytes\n' \
            | sort > report/first_party_file_index.txt

          rg -n -C 8 \
            'SendMqttEventBus|robotWithChannel0|robotWithChannel[0-9]+|MQTTControl|channel0|channel1|channel2|channel3|channel4|channel5|channel6|channel7|channel8|publishDps|setDps|chargego|power_go|switch_go|selectroom|zone_clean|part_clean|manual|reset|filter|brush|disturb|timer|schedule|dust|mop|dry|wash|voice|find.?robot|seek.?robot' \
            report/first_party_sources > report/first_party_command_context.txt || true

          python <<'PY'
          from __future__ import annotations

          import pathlib
          import re

          root = pathlib.Path("report/first_party_sources")
          rows: list[str] = []
          pattern = re.compile(
              r"SendMqttEventBus\.(?P<method>[A-Za-z0-9_]+)\((?P<args>.*?)\);",
              re.S,
          )
          for path in sorted(root.rglob("*.java")):
              text = path.read_text(encoding="utf-8", errors="ignore")
              for match in pattern.finditer(text):
                  line = text.count("\n", 0, match.start()) + 1
                  args = re.sub(r"\s+", " ", match.group("args")).strip()
                  rows.append(
                      f"{path.relative_to(root)}:{line}\t{match.group('method')}({args})"
                  )
          pathlib.Path("report/send_mqtt_calls.tsv").write_text(
              "\n".join(rows) + ("\n" if rows else ""),
              encoding="utf-8",
          )
          PY

          BUNDLE=work/jadx/resources/assets/index.android.bundle
          if [[ -f "$BUNDLE" ]]; then
            file "$BUNDLE" > report/hermes/bundle_file_type.txt
            strings -a -n 4 "$BUNDLE" > report/hermes/bundle_strings.txt
            grep -niE \
              'lynkbey|robot|mqtt|channel|command|control|manual|timer|schedule|disturb|brush|filter|reset|dust|mop|dry|wash|zone|room|map|voice|seek|find' \
              report/hermes/bundle_strings.txt > report/hermes/command_strings.txt || true
          fi

          {
            echo '# Deep LINKBEY APK source export'
            echo
            cat report/package.txt
            echo
            echo 'The artifact contains only public APK-derived source and reports.'
            echo 'No APK, Home Assistant credentials, Device ID, Local Key, cloud token or private diagnostics are included.'
          } > report/README.md

      - name: Upload text-only deep analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: s8-linkbey-deep-source-${{ github.run_number }}
          path: report/
          if-no-files-found: error
          compression-level: 6
          retention-days: 3
