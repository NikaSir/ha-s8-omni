<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S8 panel regression fixture</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif}
  body{--primary-color:#009fc5;--primary-text-color:#151515;--secondary-text-color:#606060;--disabled-text-color:#aaa;--divider-color:#dedede;--card-background-color:#fff;--primary-background-color:#fafafa}
  s8-omni-panel{display:block;height:100%;width:100%}
  #qa-tools{display:none;position:fixed;left:450px;top:8px;right:8px;bottom:8px;overflow:auto;background:#fff;border:1px solid #ccc;padding:12px}
  body.with-tools s8-omni-panel{width:430px;max-width:100%}
  body.with-tools #qa-tools{display:block}
  #qa-tools button{margin:4px;padding:8px}#qa-tools pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
<aside id="qa-tools">
  <strong>Синтетическая QA fixture · без подключения к HA</strong>
  <p><button data-fixture-status="charged">На базе</button><button data-fixture-status="cleaning">Уборка</button><button data-fixture-status="paused">Пауза</button><button data-fixture-status="unknown">Нет данных</button></p>
  <p><label>Телеметрия громкости <input id="remote-volume" type="number" value="55" min="0" max="100"></label><button id="publish-volume">Обновить телеметрию</button></p>
  <p><label><input id="automatic-readback" type="checkbox" checked> Автоматическое подтверждение устройства</label><button id="flush-readbacks">Подтвердить ожидающие записи</button></p>
  <p><button id="clear-calls">Очистить журнал команд</button></p>
  <h3>Команды HA</h3><pre id="calls-readout">[]</pre>
  <h3>Состояние fixture</h3><pre id="states-readout"></pre>
</aside>
<script type="module">
  // Synthetic device data only; this fixture never connects to Home Assistant.
  import "/frontend/s8-omni-panel-bootstrap.js";
  // Keep icon geometry inside the panel's shadow tree without loading HA's SVG library.
  customElements.define("ha-icon",class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({mode:"open"}).innerHTML = "<style>:host{display:inline-block;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px)}</style>";
    }
  });
  const entryId = "ui-regression";
  const definitions = {
    vacuum: ["vacuum", "docked", {battery_level:100}],
    battery: ["sensor", "100"], clean_time: ["sensor", "0"], clean_area: ["sensor", "0"],
    filter_life: ["sensor", "8998"], side_brush_life: ["sensor", "2419"], main_brush_life: ["sensor", "8724"],
    fault: ["sensor", "0"], robot_status: ["sensor", "charged"], station_status: ["sensor", "idle"],
    composite_status: ["sensor", "charged", {robot_on_dock:true,station_operations:[],missing_station_dps:[]}],
    telemetry_age: ["sensor", "0"],
    local_connection: ["binary_sensor", "on", {has_successful_snapshot:true,telemetry_status:"current"}],
    raw_status: ["sensor", "charge_done"], mode: ["select", "smart"], work_mode: ["sensor", "both_work"],
    suction: ["select", "gentle", {options:["gentle","normal","strong"]}],
    water: ["select", "closed", {options:["closed","low","middle","high"]}],
    volume: ["number", "50", {min:0,max:100}],
    do_not_disturb: ["switch", "off"], child_lock: ["switch", "off"],
    dust_collection: ["switch", "off"], roller_cleaning: ["switch", "off"], roller_drying: ["switch", "off"],
    refresh: ["button", "unknown"],
    start_dust_collection: ["button", "unknown"], stop_dust_collection: ["button", "unknown"],
    start_roller_cleaning: ["button", "unknown"], stop_roller_cleaning: ["button", "unknown"],
    start_roller_drying: ["button", "unknown"], stop_roller_drying: ["button", "unknown"],
  };
  const registry = Object.entries(definitions).map(([key,[domain]]) => ({
    config_entry_id:entryId, platform:"s8_omni", unique_id:`fixture_${key}`, entity_id:`${domain}.fixture_${key}`,
  }));
  let states = Object.fromEntries(Object.entries(definitions).map(([key,[domain,state,attributes={}]]) => [
    `${domain}.fixture_${key}`, {entity_id:`${domain}.fixture_${key}`,state,attributes},
  ]));
  const panel = document.createElement("s8-omni-panel");
  const calls = [], readbacks = [];
  const fixture = {panel,calls,readbacks,autoReadback:true};
  function showReadout() {
    document.querySelector("#calls-readout").textContent = JSON.stringify(calls,null,2);
    document.querySelector("#states-readout").textContent = JSON.stringify({
      pendingReadbacks:readbacks.length,
      values:Object.fromEntries(["robot_status","volume","do_not_disturb","suction","water"].map(key => {
        const entity = registry.find(item => item.unique_id === `fixture_${key}`).entity_id;
        return [key,states[entity].state];
      })),
    },null,2);
  }
  function publish() {
    panel.hass = {
      states,
      callWS:async () => registry,
      callService:async (domain,service,data) => {
        calls.push({domain,service,data:{...data}});
        showReadout();
        if (!["select","number","switch"].includes(domain)) return;
        const state = domain === "select" ? data.option : domain === "number" ? String(data.value) : service === "turn_on" ? "on" : "off";
        const update = () => {
          states = {...states,[data.entity_id]:{...states[data.entity_id],state}};
          publish();
        };
        if (fixture.autoReadback) setTimeout(update,30);
        else readbacks.push(update);
        showReadout();
      },
    };
    showReadout();
  }
  fixture.setState = (key,state,attributes) => {
    const entity = registry.find(item => item.unique_id === `fixture_${key}`).entity_id;
    states = {...states,[entity]:{...states[entity],state:String(state),attributes:attributes ?? states[entity].attributes}};
    publish();
  };
  fixture.flushReadbacks = () => { readbacks.splice(0).forEach(update => update()); showReadout(); };
  if (new URLSearchParams(location.search).has("tools")) document.body.classList.add("with-tools");
  document.querySelectorAll("[data-fixture-status]").forEach(button => button.onclick = () => {
    const status = button.dataset.fixtureStatus;
    fixture.setState("local_connection",status === "unknown" ? "unavailable" : "on");
    fixture.setState("robot_status",status);
    fixture.setState("composite_status",status,{robot_on_dock:status === "charged",station_operations:[],missing_station_dps:[]});
    fixture.setState("vacuum",status === "charged" ? "docked" : status);
    fixture.setState("clean_time",status === "cleaning" ? "120" : "0");
    fixture.setState("clean_area",status === "cleaning" ? "2" : "0");
  });
  document.querySelector("#publish-volume").onclick = () => fixture.setState("volume",document.querySelector("#remote-volume").value);
  document.querySelector("#automatic-readback").onchange = event => { fixture.autoReadback = event.target.checked; };
  document.querySelector("#flush-readbacks").onclick = fixture.flushReadbacks;
  document.querySelector("#clear-calls").onclick = () => { calls.splice(0); showReadout(); };
  panel.panel = {config:{entry_id:entryId}};
  publish();
  document.body.appendChild(panel);
  window.fixture = fixture;
</script>
</html>
